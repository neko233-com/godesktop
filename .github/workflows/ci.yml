name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-amd64:
    name: Windows amd64 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Repeated race, native input, pixel, coverage, fuzz and EXE checks
        shell: powershell
        env:
          GODESKTOP_GPU_DEBUG: '1'
        run: ./scripts/test-windows-amd64.ps1
      - name: Verify reproducible Direct3D 12 DXIL
        shell: powershell
        run: ./scripts/validate-shaders.ps1
      - name: Direct3D 12 DXIL pixels and fenced three-slot ownership
        shell: powershell
        env:
          CGO_ENABLED: '1'
          GOAMD64: 'v1'
          GOEXPERIMENT: cgocheck2
        run: |
          go run ./internal/dx12test -output .cache/dx12-default
          if ($LASTEXITCODE -ne 0) { throw 'D3D12 adapter validation failed' }
          go run ./internal/dx12test -warp -output .cache/dx12-warp
          if ($LASTEXITCODE -ne 0) { throw 'D3D12 WARP validation failed' }
          go run ./internal/dx12test -frames 7 -debug=false -output .cache/dx12-uninstrumented
          if ($LASTEXITCODE -ne 0) { throw 'D3D12 uninstrumented/remainder validation failed' }
      - name: Default HWND D3D12, glyph reuse, DXGI pacing and idle wake
        shell: powershell
        env:
          CGO_ENABLED: '1'
          GOAMD64: 'v1'
          GOEXPERIMENT: cgocheck2
          GODESKTOP_GPU_DEBUG: '1'
        run: |
          go run ./internal/renderstress -require-backend direct3d12 -require-frame-clock dxgi -glyph-atlas -output .cache/dx12-window-default.json
          if ($LASTEXITCODE -ne 0) { throw 'Default D3D12 HWND validation failed' }
          go run ./internal/renderstress -require-backend direct3d12 -require-frame-clock dxgi -glyph-atlas -completion-race -output .cache/dx12-window-completion-race.json
          if ($LASTEXITCODE -ne 0) { throw 'D3D12 completion-before-idle-wait race validation failed' }
          go run ./internal/renderstress -require-backend direct3d12 -require-frame-clock dxgi -glyph-eviction -output .cache/dx12-window-eviction.json
          if ($LASTEXITCODE -ne 0) { throw 'D3D12 glyph eviction/lifetime validation failed' }
          go run ./internal/renderstress -require-backend direct3d12 -require-frame-clock dxgi -device-recovery -output .cache/dx12-window-recovery.json
          if ($LASTEXITCODE -ne 0) { throw 'D3D12 actual device removal/recovery validation failed' }
          $env:GODESKTOP_GPU_ADAPTER = 'warp'
          go run ./internal/renderstress -require-backend direct3d12 -require-frame-clock dxgi -glyph-atlas -output .cache/dx12-window-warp.json
          if ($LASTEXITCODE -ne 0) { throw 'WARP D3D12 HWND validation failed' }
          go run ./internal/renderstress -require-backend direct3d12 -require-frame-clock dxgi -device-recovery -output .cache/dx12-window-recovery-warp.json
          if ($LASTEXITCODE -ne 0) { throw 'WARP actual device removal/recovery validation failed' }
          go test -race -run '^TestWindowsAMD64NativeIntegration$' -count=1 -timeout=3m .
          if ($LASTEXITCODE -ne 0) { throw 'WARP native input/Unicode/pixel validation failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-amd64-${{ matrix.os }}
          path: |
            .cache/windows-validation/
            bin/counter*.exe
            testdata/fuzz/
            .cache/dx12-default/
            .cache/dx12-warp/
            .cache/dx12-uninstrumented/
            .cache/dx12-window-*.json
            .cache/dx12-window-*.json.png
          include-hidden-files: true
          if-no-files-found: warn

  native:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      GOEXPERIMENT: cgocheck2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test with race detector
        run: go test -race -shuffle=on -count=3 ./...
      - name: Vet
        run: go vet ./...
      - name: Build example
        shell: bash
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/counter ./examples/counter
      - name: Native render and dispatch smoke test
        shell: bash
        run: go run ./examples/counter -smoke
      - name: Metal instancing, glyph reuse, display pacing and idle wake
        shell: bash
        run: go run ./internal/renderstress -require-backend metal -require-frame-clock cametaldisplaylink -glyph-atlas -output bin/metal-render-stress.json
      - name: Metal glyph eviction and asynchronous page ownership
        shell: bash
        run: go run ./internal/renderstress -require-backend metal -require-frame-clock cametaldisplaylink -glyph-eviction -output bin/metal-glyph-eviction.json
      - name: Actual Metal drawable geometry and Unicode pixels
        shell: bash
        run: go run ./internal/metaltest -output bin/metal-pixels
      - name: Metal resources, window identity and Go state after recovery
        shell: bash
        run: go run ./internal/renderstress -require-backend metal -require-frame-clock cametaldisplaylink -metal-recovery -output bin/metal-recovery.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: counter-${{ runner.os }}-${{ runner.arch }}
          path: |
            bin/counter*
            bin/metal-render-stress.json
            bin/metal-glyph-eviction.json
            bin/metal-pixels/
            bin/metal-recovery.json*
          if-no-files-found: warn

  core:
    name: Portable core / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go test -race -shuffle=on -count=3 ./...
      - name: No-cgo fallback
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - run: go vet ./...
      - name: Geometry and layout fuzzing
        run: |
          go test -run '^$' -fuzz '^FuzzRectIntersection$' -fuzztime=5s -parallel=4 .
          go test -run '^$' -fuzz '^FuzzLayoutClipsToViewport$' -fuzztime=5s -parallel=4 .
      - run: go test -run '^$' -bench . -benchmem ./...
